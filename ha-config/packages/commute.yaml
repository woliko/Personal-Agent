# =============================================================================
# Agent 1: Daily Commute
# =============================================================================
# Self-contained HA package. Drop into /config/packages/ and reference from
# configuration.yaml with:
#   homeassistant:
#     packages: !include_dir_named packages
#
# API: v6.db.transport.rest (Deutsche Bahn REST wrapper, free, no key).
#   Locations: https://v6.db.transport.rest/locations?query=<name>
#   Journeys : https://v6.db.transport.rest/journeys?from=<evaId>&to=<evaId>&results=3
# Station names are intentionally NOT used as URL params — EVA IDs are pinned
# below so a name change upstream can't break the sensors.
#
# Known EVA IDs (verified via scripts/test_db_api.py):
#   Solln          8005292
#   Muenchen Hbf   8000261
#   Kaufering      8003336
#
# Response shape (hafas-client v6):
#   { "journeys": [ { "legs": [ {
#       "departure": "ISO8601",           <- real-time
#       "plannedDeparture": "ISO8601",    <- schedule
#       "departureDelay": <seconds>,      <- NOTE: SECONDS, not minutes
#       "arrival":  "ISO8601",
#       "arrivalDelay": <seconds>,
#       "cancelled": bool,
#       "line": { "name": "RE 9", ... },
#       "remarks": [ { "type": "...", "text": "..." } ]
#       } ] } ] }
#
# Telegram commands (direction-based — no time-aware dispatch):
#   /office      — subscribe to outbound alerts + show next 3 Munich ->
#                  Kaufering departures on both routes (Solln direct,
#                  Hbf +cycle). Also unsubscribes return alerts.
#   /office_tmr  — subscribe to outbound alerts for tomorrow from 06:00 +
#                  derived alarm (earliest non-cancelled Solln - 45 min).
#                  Flips commute_outbound_alerts ON only if viable.
#   /home        — subscribe to return alerts + show next 3 Kaufering ->
#                  Munich departures on both directions. Also unsubscribes
#                  outbound alerts.
#   /quiet       — unsubscribe from both outbound and return alerts.
#
# No Claude synthesis in any command path — the user picks a route. We just
# render the data. claude_api is still defined for future agents.
#
# Alert subscription model — two independent booleans drive polling and
# disruption alerts so you only get pinged about the direction you actually
# care about right now:
#   commute_outbound_alerts — ON while heading to the office (morning)
#   commute_return_alerts   — ON while heading home (afternoon/evening)
#
# Background automations:
#   Morning poll   — 05:00-07:00, refresh outbound sensors every 5 min
#                    (guarded by commute_outbound_alerts=on)
#   Return poll    — 16:00-18:00, refresh inbound sensors every 10 min
#                    (guarded by commute_return_alerts=on)
#   Disruption     — Telegram alert on delayed/cancelled, per direction,
#                    deduped per hour
#   Auto-switch    — 14:00 daily: if outbound is still ON, flip to return
#                    (models "I'm in the office now, thinking about home")
#   Reset          — 19:00 daily: both booleans → off (proxy for "home by 19:00";
#                    upgrade to a device_tracker/zone.home condition once the
#                    HA Companion app is wired up)
#
# HA version requirement: >= 2023.7 for `response_variable` on rest_command.
# =============================================================================


# -------- Helpers ------------------------------------------------------------
input_boolean:
  commute_outbound_alerts:
    name: Commute outbound alerts
    icon: mdi:train-car
  commute_return_alerts:
    name: Commute return alerts
    icon: mdi:home-import-outline

input_datetime:
  alarm_time:
    name: Suggested alarm time
    has_date: false
    has_time: true

input_number:
  commute_delay_threshold_min:
    name: Commute delay threshold (minutes)
    min: 1
    max: 60
    step: 1
    initial: 5
    mode: box

input_text:
  commute_last_check:
    name: Commute last check-in (iso timestamp)
    max: 40
  commute_morning_summary:
    name: Commute morning preview (last Claude output)
    max: 255
  commute_last_alert_fingerprint:
    # Hash of (route, date, hour-bucket) so a recurring disruption within the
    # same hour is only pushed once, not every poll cycle.
    name: Commute last-alert fingerprint
    max: 255
  commute_model_sonnet:
    name: Commute model — extraction/classification
    max: 64
    initial: claude-sonnet-4-6
  commute_model_opus:
    name: Commute model — synthesis/judgement
    max: 64
    initial: claude-opus-4-7


# -------- REST sensors -------------------------------------------------------
# Long default poll (1h). Morning/evening automations force updates every
# 5/10 min during active windows, guarded by the per-direction alert booleans.
#
# YAML anchors (&sensor_common / <<: *sensor_common) DRY up the four sensor
# definitions so only (name, unique_id, route_label) differ per entry. The
# value_template, json_attributes and json_attributes_path are identical.
rest:
  - resource: https://v6.db.transport.rest/journeys?from=8005292&to=8003336&results=3
    scan_interval: 3600
    timeout: 20
    sensor:
      - &sensor_common
        name: "DB Solln Kaufering"
        unique_id: db_solln_kaufering
        # Display next real-time departure as local HH:MM (handles Z / +01 / +02).
        value_template: >-
          {% set j = value_json.journeys[0] if value_json.journeys else None %}
          {% if j and j.legs %}
            {{ (j.legs[0].departure | as_datetime | as_local).strftime('%H:%M') }}
          {% else %}unknown
          {% endif %}
        json_attributes_path: "$.journeys[0]"
        json_attributes:
          - legs
          - refreshToken

  - resource: https://v6.db.transport.rest/journeys?from=8000261&to=8003336&results=3
    scan_interval: 3600
    timeout: 20
    sensor:
      - <<: *sensor_common
        name: "DB Hbf Kaufering"
        unique_id: db_hbf_kaufering

  - resource: https://v6.db.transport.rest/journeys?from=8003336&to=8000261&results=3
    scan_interval: 3600
    timeout: 20
    sensor:
      - <<: *sensor_common
        name: "DB Kaufering Return Hbf"
        unique_id: db_kaufering_return_hbf

  - resource: https://v6.db.transport.rest/journeys?from=8003336&to=8005292&results=3
    scan_interval: 3600
    timeout: 20
    sensor:
      - <<: *sensor_common
        name: "DB Kaufering Return Solln"
        unique_id: db_kaufering_return_solln


# -------- Template sensors (computed) ----------------------------------------
# Normalised per-route status used by the disruption automation.
# `delay_minutes` is explicitly cast to int and computed from seconds
# (v6 API reports departureDelay in seconds).
# `route_label` is a human-readable attribute so downstream code
# doesn't have to reverse-engineer entity_ids.
template:
  - sensor:
      - name: "Commute Solln Kaufering status"
        unique_id: commute_solln_kaufering_status
        state: >-
          {% set threshold = states('input_number.commute_delay_threshold_min') | int(5) %}
          {% set legs = state_attr('sensor.db_solln_kaufering', 'legs') %}
          {% if legs and legs[0].cancelled %}cancelled
          {% elif legs and ((legs[0].departureDelay | default(0) | int(0)) // 60) > threshold %}delayed
          {% elif legs %}ok
          {% else %}unknown{% endif %}
        attributes:
          route_label: "Solln → Kaufering"
          delay_minutes: >-
            {% set legs = state_attr('sensor.db_solln_kaufering', 'legs') %}
            {{ ((legs[0].departureDelay | default(0) | int(0)) // 60) if legs else 0 }}
          messages: >-
            {% set legs = state_attr('sensor.db_solln_kaufering', 'legs') %}
            {{ (legs[0].remarks | selectattr('type','equalto','warning') | map(attribute='text') | list) if legs and legs[0].remarks else [] }}

      - name: "Commute Hbf Kaufering status"
        unique_id: commute_hbf_kaufering_status
        state: >-
          {% set threshold = states('input_number.commute_delay_threshold_min') | int(5) %}
          {% set legs = state_attr('sensor.db_hbf_kaufering', 'legs') %}
          {% if legs and legs[0].cancelled %}cancelled
          {% elif legs and ((legs[0].departureDelay | default(0) | int(0)) // 60) > threshold %}delayed
          {% elif legs %}ok
          {% else %}unknown{% endif %}
        attributes:
          route_label: "München Hbf → Kaufering"
          delay_minutes: >-
            {% set legs = state_attr('sensor.db_hbf_kaufering', 'legs') %}
            {{ ((legs[0].departureDelay | default(0) | int(0)) // 60) if legs else 0 }}
          messages: >-
            {% set legs = state_attr('sensor.db_hbf_kaufering', 'legs') %}
            {{ (legs[0].remarks | selectattr('type','equalto','warning') | map(attribute='text') | list) if legs and legs[0].remarks else [] }}

      - name: "Commute Return Hbf status"
        unique_id: commute_return_hbf_status
        state: >-
          {% set threshold = states('input_number.commute_delay_threshold_min') | int(5) %}
          {% set legs = state_attr('sensor.db_kaufering_return_hbf', 'legs') %}
          {% if legs and legs[0].cancelled %}cancelled
          {% elif legs and ((legs[0].departureDelay | default(0) | int(0)) // 60) > threshold %}delayed
          {% elif legs %}ok
          {% else %}unknown{% endif %}
        attributes:
          route_label: "Kaufering → München Hbf"
          delay_minutes: >-
            {% set legs = state_attr('sensor.db_kaufering_return_hbf', 'legs') %}
            {{ ((legs[0].departureDelay | default(0) | int(0)) // 60) if legs else 0 }}
          messages: >-
            {% set legs = state_attr('sensor.db_kaufering_return_hbf', 'legs') %}
            {{ (legs[0].remarks | selectattr('type','equalto','warning') | map(attribute='text') | list) if legs and legs[0].remarks else [] }}

      - name: "Commute Return Solln status"
        unique_id: commute_return_solln_status
        state: >-
          {% set threshold = states('input_number.commute_delay_threshold_min') | int(5) %}
          {% set legs = state_attr('sensor.db_kaufering_return_solln', 'legs') %}
          {% if legs and legs[0].cancelled %}cancelled
          {% elif legs and ((legs[0].departureDelay | default(0) | int(0)) // 60) > threshold %}delayed
          {% elif legs %}ok
          {% else %}unknown{% endif %}
        attributes:
          route_label: "Kaufering → Solln"
          delay_minutes: >-
            {% set legs = state_attr('sensor.db_kaufering_return_solln', 'legs') %}
            {{ ((legs[0].departureDelay | default(0) | int(0)) // 60) if legs else 0 }}
          messages: >-
            {% set legs = state_attr('sensor.db_kaufering_return_solln', 'legs') %}
            {{ (legs[0].remarks | selectattr('type','equalto','warning') | map(attribute='text') | list) if legs and legs[0].remarks else [] }}

  # Fires when any DB sensor is unavailable — lets us notice API outages
  # instead of silently showing stale state.
  - binary_sensor:
      - name: "Commute API stale"
        unique_id: commute_api_stale
        device_class: problem
        state: >-
          {% set ids = [
            'sensor.db_solln_kaufering',
            'sensor.db_hbf_kaufering',
            'sensor.db_kaufering_return_hbf',
            'sensor.db_kaufering_return_solln'
          ] %}
          {{ ids | select('is_state', 'unavailable') | list | count > 0
             or ids | select('is_state', 'unknown')    | list | count == (ids | count) }}


# -------- REST commands ------------------------------------------------------
# Claude API defined here (not in a separate package) because agents 2 and 5
# will reuse it. Move to a dedicated claude.yaml package once Agent 2 lands.
# Model IDs are read from input_text helpers so they can be rotated without a
# config edit + restart (see commute_model_sonnet / commute_model_opus above).
rest_command:
  claude_api:
    url: "https://api.anthropic.com/v1/messages"
    method: POST
    headers:
      x-api-key: !secret anthropic_api_key
      anthropic-version: "2023-06-01"
      content-type: "application/json"
    payload: >-
      {
        "model": {{ model | to_json }},
        "max_tokens": {{ max_tokens | default(1024) }},
        "system": {{ system | default('You are a helpful assistant.') | to_json }},
        "messages": [{"role": "user", "content": {{ prompt | to_json }}}]
      }
    content_type: "application/json"
    timeout: 30

  # On-demand v6.db.transport.rest journey lookup with an explicit departure.
  # Used by the tomorrow branch of /office so we don't have to wait for the
  # scheduled poll (and so we can query a departure time outside the default
  # "now" window). EVA IDs are passed in by the caller — we do NOT hard-code
  # station names anywhere in URL templates.
  #
  # departure_iso MUST be naive local time (no TZ suffix, no "Z"). A `+02:00`
  # suffix gets interpreted as a space inside a URL query string (standard
  # application/x-www-form-urlencoded behaviour) and breaks the hafas-client
  # parser; v6 then silently returns an empty `journeys: []`.
  db_journeys_lookup:
    url: "https://v6.db.transport.rest/journeys?from={{ from_eva }}&to={{ to_eva }}&departure={{ departure_iso }}&results=3"
    method: GET
    timeout: 20


# -------- Scripts ------------------------------------------------------------
script:
  commute_refresh_all:
    alias: Commute - refresh all sensors
    sequence:
      - service: homeassistant.update_entity
        target:
          entity_id:
            - sensor.db_solln_kaufering
            - sensor.db_hbf_kaufering
            - sensor.db_kaufering_return_hbf
            - sensor.db_kaufering_return_solln


# -------- Automations --------------------------------------------------------
automation:
  # ----- Morning polling (05:00-07:00) --------------------------------------
  - id: commute_morning_poll
    alias: Commute - morning poll
    description: Refresh morning route sensors every 5 min during the morning window.
    trigger:
      - platform: time_pattern
        minutes: "/5"
    condition:
      - condition: state
        entity_id: input_boolean.commute_outbound_alerts
        state: "on"
      - condition: time
        after: "05:00:00"
        before: "07:00:00"
    action:
      - service: homeassistant.update_entity
        target:
          entity_id:
            - sensor.db_solln_kaufering
            - sensor.db_hbf_kaufering
    mode: single

  # ----- Evening return polling (16:00-18:00) -------------------------------
  - id: commute_evening_poll
    alias: Commute - evening poll
    description: Refresh return route sensors every 10 min during the return window.
    trigger:
      - platform: time_pattern
        minutes: "/10"
    condition:
      - condition: state
        entity_id: input_boolean.commute_return_alerts
        state: "on"
      - condition: time
        after: "16:00:00"
        before: "18:00:00"
    action:
      - service: homeassistant.update_entity
        target:
          entity_id:
            - sensor.db_kaufering_return_hbf
            - sensor.db_kaufering_return_solln
    mode: single

  # ----- Disruption alert ---------------------------------------------------
  # Fires whenever any route goes delayed/cancelled. Deduped via
  # commute_last_alert_fingerprint keyed on (route, date, hour-bucket) so a
  # single disruption within the same hour is only pushed once, even if the
  # sensor flaps ok→delayed→ok→delayed.
  - id: commute_disruption_alert
    alias: Commute - disruption alert
    trigger:
      - platform: state
        entity_id:
          - sensor.commute_solln_kaufering_status
          - sensor.commute_hbf_kaufering_status
          - sensor.commute_return_hbf_status
          - sensor.commute_return_solln_status
        to:
          - delayed
          - cancelled
    condition:
      # Direction-aware gate: return-route triggers fire only when subscribed
      # to return alerts; everything else is an outbound route and gated on
      # outbound alerts. "return" appears in the template sensor entity_ids
      # for both Kaufering -> Solln and Kaufering -> Hbf.
      - condition: template
        value_template: >-
          {% if 'return' in trigger.entity_id %}
            {{ is_state('input_boolean.commute_return_alerts', 'on') }}
          {% else %}
            {{ is_state('input_boolean.commute_outbound_alerts', 'on') }}
          {% endif %}
      - condition: template
        value_template: >-
          {% set bucket = now().strftime('%Y-%m-%d-%H') %}
          {% set fp = trigger.entity_id ~ ':' ~ trigger.to_state.state ~ ':' ~ bucket %}
          {{ fp != states('input_text.commute_last_alert_fingerprint') }}
    action:
      - service: input_text.set_value
        target:
          entity_id: input_text.commute_last_alert_fingerprint
        data:
          value: >-
            {% set bucket = now().strftime('%Y-%m-%d-%H') %}
            {{ trigger.entity_id }}:{{ trigger.to_state.state }}:{{ bucket }}
      - service: telegram_bot.send_message
        target:
          entity_id: notify.pa_bot_wolfgang_l
        data:
          # No parse_mode — DB remarks can contain arbitrary characters and
          # would trip Telegram's legacy Markdown parser.
          message: >-
            🚆 Commute disruption

            Route: {{ trigger.to_state.attributes.route_label | default(trigger.entity_id) }}
            Status: {{ trigger.to_state.state }}
            Delay: {{ trigger.to_state.attributes.delay_minutes | default(0) | int(0) }} min
            {% if trigger.to_state.attributes.messages %}
            Notes: {{ trigger.to_state.attributes.messages | join('; ') }}
            {% endif %}
    mode: queued
    max: 10

  # ----- API stale alert ----------------------------------------------------
  # Pings Telegram if the DB REST sensors start returning unavailable.
  # Fires once on the unavailable→available transition (not per poll).
  - id: commute_api_stale_alert
    alias: Commute - API stale alert
    trigger:
      - platform: state
        entity_id: binary_sensor.commute_api_stale
        to: "on"
        for: "00:15:00"
    condition:
      # Fire if subscribed in either direction.
      - condition: or
        conditions:
          - condition: state
            entity_id: input_boolean.commute_outbound_alerts
            state: "on"
          - condition: state
            entity_id: input_boolean.commute_return_alerts
            state: "on"
    action:
      - service: telegram_bot.send_message
        target:
          entity_id: notify.pa_bot_wolfgang_l
        data:
          message: >-
            ⚠️ *Commute API stale*

            DB REST sensors have been unavailable for 15+ min. Disruption
            alerts may be missing. Check HA logs or v6.db.transport.rest status.
          parse_mode: markdown
    mode: single

  # ----- Telegram /office (outbound to Kaufering, live) ---------------------
  # Subscribes to outbound alerts + shows the next 3 Munich -> Kaufering
  # departures on both routes. Unsubscribes return alerts so you don't get
  # pinged about the return leg while you're still on your way in.
  - id: commute_telegram_checkin
    alias: Commute - Telegram /office
    trigger:
      - platform: event
        event_type: telegram_command
        event_data:
          command: /office
    action:
      - service: input_text.set_value
        target:
          entity_id: input_text.commute_last_check
        data:
          value: "{{ now().isoformat() }}"
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.commute_outbound_alerts
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.commute_return_alerts
      - variables:
          departure_iso: "{{ now().strftime('%Y-%m-%dT%H:%M:%S') }}"
      - service: rest_command.db_journeys_lookup
        data:
          from_eva: "8005292"
          to_eva: "8003336"
          departure_iso: "{{ departure_iso }}"
        response_variable: solln_resp
        continue_on_error: true
      - service: rest_command.db_journeys_lookup
        data:
          from_eva: "8000261"
          to_eva: "8003336"
          departure_iso: "{{ departure_iso }}"
        response_variable: hbf_resp
        continue_on_error: true
      - variables:
          solln_journeys: >-
            {{ solln_resp.content.journeys
               if solln_resp is defined
                 and solln_resp.content is defined
                 and solln_resp.content.journeys is defined
               else [] }}
          hbf_journeys: >-
            {{ hbf_resp.content.journeys
               if hbf_resp is defined
                 and hbf_resp.content is defined
                 and hbf_resp.content.journeys is defined
               else [] }}
      - service: telegram_bot.send_message
        target:
          entity_id: notify.pa_bot_wolfgang_l
        data:
          message: |-
            {%- macro render(journeys) -%}
            {%- for j in journeys[:3] %}
            {%- set first = j.legs[0] %}
            {%- set dm = (first.departureDelay | default(0) | int(0)) // 60 %}
            {%- set ns = namespace(cc=false) %}
            {%- for l in j.legs %}{%- if l.cancelled | default(false) %}{%- set ns.cc = true %}{%- endif %}{%- endfor %}
              {{ (first.departure | as_datetime | as_local).strftime('%H:%M') }}
            {%- if ns.cc %}  CANCELLED
            {%- else %}
            {%- if dm > 0 %}  +{{ dm }} min{% endif %}
            {%- for l in j.legs %}
            {%- if not loop.first %}  |  {{ (l.departure | as_datetime | as_local).strftime('%H:%M') }}{% endif %}  →  {{ (l.arrival | as_datetime | as_local).strftime('%H:%M') }}
            {%- endfor %}
            {%- endif %}
            {%- else %}
              (no data)
            {%- endfor %}
            {%- endmacro -%}
            🚆 To office ({{ now().strftime('%H:%M') }})  ·  outbound alerts ON

            Solln → Hbf → Kaufering:{{ render(solln_journeys) }}

            München Hbf → Kaufering:{{ render(hbf_journeys) }}
    mode: single

  # ----- Telegram /office_tmr (plan tomorrow morning) -----------------------
  # Standalone one-word command (Telegram dispatches /office and /office_tmr
  # as distinct commands). Queries v6 for tomorrow 06:00 on both routes,
  # subscribes outbound alerts + sets the alarm only when a non-cancelled
  # Solln departure exists. No fallback alarm.
  - id: commute_telegram_checkin_tomorrow
    alias: Commute - Telegram /office_tmr
    trigger:
      - platform: event
        event_type: telegram_command
        event_data:
          command: /office_tmr
    action:
      - service: input_text.set_value
        target:
          entity_id: input_text.commute_last_check
        data:
          value: "{{ now().isoformat() }}"
      - variables:
          # Tomorrow 06:00, naive local (no TZ suffix — see db_journeys_lookup).
          departure_iso: >-
            {{ (now().replace(hour=6, minute=0, second=0, microsecond=0)
                + timedelta(days=1)).strftime('%Y-%m-%dT%H:%M:%S') }}
          day_label: "{{ (now() + timedelta(days=1)).strftime('%a %d.%m') }}"
      - service: rest_command.db_journeys_lookup
        data:
          from_eva: "8005292"
          to_eva: "8003336"
          departure_iso: "{{ departure_iso }}"
        response_variable: solln_resp
        continue_on_error: true
      - service: rest_command.db_journeys_lookup
        data:
          from_eva: "8000261"
          to_eva: "8003336"
          departure_iso: "{{ departure_iso }}"
        response_variable: hbf_resp
        continue_on_error: true
      - variables:
          solln_journeys: >-
            {{ solln_resp.content.journeys
               if solln_resp is defined
                 and solln_resp.content is defined
                 and solln_resp.content.journeys is defined
               else [] }}
          hbf_journeys: >-
            {{ hbf_resp.content.journeys
               if hbf_resp is defined
                 and hbf_resp.content is defined
                 and hbf_resp.content.journeys is defined
               else [] }}
          # Earliest non-cancelled Solln departure (ISO) — used to derive
          # the alarm. namespace() so we can emulate "first match" in Jinja.
          earliest_solln_iso: >-
            {%- set ns = namespace(t='') -%}
            {%- for j in (solln_resp.content.journeys
                          if solln_resp is defined
                            and solln_resp.content is defined
                            and solln_resp.content.journeys is defined
                          else []) -%}
              {%- if ns.t == '' and not (j.legs[0].cancelled | default(false)) -%}
                {%- set ns.t = j.legs[0].departure -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.t }}
      - variables:
          has_viable: "{{ earliest_solln_iso != '' }}"
          earliest_hhmm: >-
            {{ (earliest_solln_iso | as_datetime | as_local).strftime('%H:%M')
               if earliest_solln_iso else '' }}
          alarm_hhmm: >-
            {{ ((earliest_solln_iso | as_datetime | as_local) - timedelta(minutes=45)).strftime('%H:%M')
               if earliest_solln_iso else '' }}
      - service: input_text.set_value
        target:
          entity_id: input_text.commute_morning_summary
        data:
          value: >-
            {{ ('Earliest Solln ' ~ earliest_hhmm ~ ', alarm ' ~ alarm_hhmm)
               if has_viable else 'No viable departures' }}
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ has_viable }}"
            sequence:
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.commute_outbound_alerts
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.commute_return_alerts
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.alarm_time
                data:
                  time: "{{ alarm_hhmm }}:00"
      - service: telegram_bot.send_message
        target:
          entity_id: notify.pa_bot_wolfgang_l
        data:
          message: |-
            {%- macro render(journeys) -%}
            {%- for j in journeys[:3] %}
            {%- set first = j.legs[0] %}
            {%- set dm = (first.departureDelay | default(0) | int(0)) // 60 %}
            {%- set ns = namespace(cc=false) %}
            {%- for l in j.legs %}{%- if l.cancelled | default(false) %}{%- set ns.cc = true %}{%- endif %}{%- endfor %}
              {{ (first.departure | as_datetime | as_local).strftime('%H:%M') }}
            {%- if ns.cc %}  CANCELLED
            {%- else %}
            {%- if dm > 0 %}  +{{ dm }} min{% endif %}
            {%- for l in j.legs %}
            {%- if not loop.first %}  |  {{ (l.departure | as_datetime | as_local).strftime('%H:%M') }}{% endif %}  →  {{ (l.arrival | as_datetime | as_local).strftime('%H:%M') }}
            {%- endfor %}
            {%- endif %}
            {%- else %}
              (no data)
            {%- endfor %}
            {%- endmacro -%}
            🚆 Tomorrow {{ day_label }}

            Solln → Hbf → Kaufering (45 min wake→door):{{ render(solln_journeys) }}

            München Hbf → Kaufering (+15 min cycle to Hbf, 60 min wake→door):{{ render(hbf_journeys) }}

            {% if has_viable -%}
            Earliest Solln: {{ earliest_hhmm }}  →  alarm {{ alarm_hhmm }}
            outbound alerts: ON
            {%- else -%}
            No viable departures — outbound alerts left off. Toggle manually if you still plan to commute.
            {%- endif %}
    mode: single

  # ----- Telegram /home (inbound from Kaufering) ----------------------------
  # Subscribes to return alerts + shows the next 3 Kaufering -> Munich
  # departures on both directions. Unsubscribes outbound alerts so disruption
  # pings stop firing for the morning direction once you're heading home.
  - id: commute_telegram_home
    alias: Commute - Telegram /home
    trigger:
      - platform: event
        event_type: telegram_command
        event_data:
          command: /home
    action:
      - service: input_text.set_value
        target:
          entity_id: input_text.commute_last_check
        data:
          value: "{{ now().isoformat() }}"
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.commute_return_alerts
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.commute_outbound_alerts
      - variables:
          departure_iso: "{{ now().strftime('%Y-%m-%dT%H:%M:%S') }}"
      - service: rest_command.db_journeys_lookup
        data:
          from_eva: "8003336"
          to_eva: "8005292"
          departure_iso: "{{ departure_iso }}"
        response_variable: solln_resp
        continue_on_error: true
      - service: rest_command.db_journeys_lookup
        data:
          from_eva: "8003336"
          to_eva: "8000261"
          departure_iso: "{{ departure_iso }}"
        response_variable: hbf_resp
        continue_on_error: true
      - variables:
          solln_journeys: >-
            {{ solln_resp.content.journeys
               if solln_resp is defined
                 and solln_resp.content is defined
                 and solln_resp.content.journeys is defined
               else [] }}
          hbf_journeys: >-
            {{ hbf_resp.content.journeys
               if hbf_resp is defined
                 and hbf_resp.content is defined
                 and hbf_resp.content.journeys is defined
               else [] }}
      - service: telegram_bot.send_message
        target:
          entity_id: notify.pa_bot_wolfgang_l
        data:
          message: |-
            {%- macro render(journeys) -%}
            {%- for j in journeys[:3] %}
            {%- set first = j.legs[0] %}
            {%- set dm = (first.departureDelay | default(0) | int(0)) // 60 %}
            {%- set ns = namespace(cc=false) %}
            {%- for l in j.legs %}{%- if l.cancelled | default(false) %}{%- set ns.cc = true %}{%- endif %}{%- endfor %}
              {{ (first.departure | as_datetime | as_local).strftime('%H:%M') }}
            {%- if ns.cc %}  CANCELLED
            {%- else %}
            {%- if dm > 0 %}  +{{ dm }} min{% endif %}
            {%- for l in j.legs %}
            {%- if not loop.first %}  |  {{ (l.departure | as_datetime | as_local).strftime('%H:%M') }}{% endif %}  →  {{ (l.arrival | as_datetime | as_local).strftime('%H:%M') }}
            {%- endfor %}
            {%- endif %}
            {%- else %}
              (no data)
            {%- endfor %}
            {%- endmacro -%}
            🏠 To home ({{ now().strftime('%H:%M') }})  ·  return alerts ON

            Kaufering → Hbf → Solln:{{ render(solln_journeys) }}

            Kaufering → München Hbf (then cycle home):{{ render(hbf_journeys) }}
    mode: single

  # ----- Telegram /quiet ----------------------------------------------------
  # Unsubscribe from both directions. Use when you're not commuting (WFH,
  # weekend, already at home) and don't want disruption pings.
  - id: commute_telegram_quiet
    alias: Commute - Telegram /quiet
    trigger:
      - platform: event
        event_type: telegram_command
        event_data:
          command: /quiet
    action:
      - service: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.commute_outbound_alerts
            - input_boolean.commute_return_alerts
      - service: telegram_bot.send_message
        target:
          entity_id: notify.pa_bot_wolfgang_l
        data:
          message: "🔕 Commute alerts off (outbound + return)."
    mode: single

  # ----- Midday auto-switch (outbound -> return at 14:00) -------------------
  # Models "I'm in the office now, so from here on I only care about the way
  # home". Only flips if outbound was still on — if the user already /quiet'd
  # or never /office'd, this is a no-op.
  - id: commute_midday_switch
    alias: Commute - auto-switch outbound to return at 14:00
    trigger:
      - platform: time
        at: "14:00:00"
    condition:
      - condition: state
        entity_id: input_boolean.commute_outbound_alerts
        state: "on"
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.commute_outbound_alerts
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.commute_return_alerts
    mode: single

  # ----- Daily reset (home-proxy, opt-in model) -----------------------------
  # 19:00 is a time-based stand-in for "should be home by now". Both booleans
  # flip off so the next morning starts clean. When a device_tracker is wired
  # up (HA Companion app + zone.home), swap this for a trigger on the tracker
  # transitioning to `home`.
  - id: commute_daily_reset
    alias: Commute - daily reset at 19:00
    trigger:
      - platform: time
        at: "19:00:00"
    action:
      - service: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.commute_outbound_alerts
            - input_boolean.commute_return_alerts
      - service: input_text.set_value
        target:
          entity_id: input_text.commute_last_alert_fingerprint
        data:
          value: ""
    mode: single
