# =============================================================================
# Agent 1: Daily Commute
# =============================================================================
# Self-contained HA package. Drop into /config/packages/ and reference from
# configuration.yaml with:
#   homeassistant:
#     packages: !include_dir_named packages
#
# API: v6.db.transport.rest (Deutsche Bahn REST wrapper, free, no key).
#   Locations: https://v6.db.transport.rest/locations?query=<name>
#   Journeys : https://v6.db.transport.rest/journeys?from=<evaId>&to=<evaId>&results=3
# Station names are intentionally NOT used as URL params — EVA IDs are pinned
# below so a name change upstream can't break the sensors.
#
# Known EVA IDs (verified via scripts/test_db_api.py):
#   Solln          8005292
#   Muenchen Hbf   8000261
#   Kaufering      8003336
#
# Response shape (hafas-client v6):
#   { "journeys": [ { "legs": [ {
#       "departure": "ISO8601",           <- real-time
#       "plannedDeparture": "ISO8601",    <- schedule
#       "departureDelay": <seconds>,      <- NOTE: SECONDS, not minutes
#       "arrival":  "ISO8601",
#       "arrivalDelay": <seconds>,
#       "cancelled": bool,
#       "line": { "name": "RE 9", ... },
#       "remarks": [ { "type": "...", "text": "..." } ]
#       } ] } ] }
#
# Telegram commands (time-aware dispatch based on local hour):
#   /office              — no arg: <14h → live_morning, <19h → live_return,
#                          >=19h → tomorrow
#   /office now          — force live_morning (next outbound from polled sensors)
#   /office tomorrow     — force tomorrow (explicit 06:00 lookup via
#                          rest_command.db_journeys_lookup)
#   /home                — always live_return (Kaufering → Munich now)
#
# Tomorrow mode flips commute_day ON only when Claude returns a viable
# ALARM=HH:MM line; otherwise commute_day stays off and the user is told
# to toggle it manually.
#
# Background automations (only fire when commute_day=on):
#   Morning poll — 05:00-07:00, refresh outbound sensors every 5 min
#   Return poll  — 16:00-18:00, refresh inbound sensors every 10 min
#   Disruption   — Telegram alert on delayed/cancelled, deduped per hour
#   Reset        — 19:00 daily: commute_day → off (opt-in each evening)
#
# HA version requirement: >= 2023.7 for `response_variable` on rest_command.
# =============================================================================


# -------- Helpers ------------------------------------------------------------
input_boolean:
  commute_day:
    name: Commute day
    icon: mdi:train

input_datetime:
  alarm_time:
    name: Suggested alarm time
    has_date: false
    has_time: true

input_number:
  commute_delay_threshold_min:
    name: Commute delay threshold (minutes)
    min: 1
    max: 60
    step: 1
    initial: 5
    mode: box

input_text:
  commute_last_check:
    name: Commute last check-in (iso timestamp)
    max: 40
  commute_morning_summary:
    name: Commute morning preview (last Claude output)
    max: 255
  commute_last_alert_fingerprint:
    # Hash of (route, date, hour-bucket) so a recurring disruption within the
    # same hour is only pushed once, not every poll cycle.
    name: Commute last-alert fingerprint
    max: 255
  commute_model_sonnet:
    name: Commute model — extraction/classification
    max: 64
    initial: claude-sonnet-4-6
  commute_model_opus:
    name: Commute model — synthesis/judgement
    max: 64
    initial: claude-opus-4-7


# -------- REST sensors -------------------------------------------------------
# Long default poll (1h). Morning/evening automations force updates every
# 5/10 min during active windows when commute_day is on.
#
# YAML anchors (&sensor_common / <<: *sensor_common) DRY up the four sensor
# definitions so only (name, unique_id, route_label) differ per entry. The
# value_template, json_attributes and json_attributes_path are identical.
rest:
  - resource: https://v6.db.transport.rest/journeys?from=8005292&to=8003336&results=3
    scan_interval: 3600
    timeout: 20
    sensor:
      - &sensor_common
        name: "DB Solln Kaufering"
        unique_id: db_solln_kaufering
        # Display next real-time departure as local HH:MM (handles Z / +01 / +02).
        value_template: >-
          {% set j = value_json.journeys[0] if value_json.journeys else None %}
          {% if j and j.legs %}
            {{ (j.legs[0].departure | as_datetime | as_local).strftime('%H:%M') }}
          {% else %}unknown
          {% endif %}
        json_attributes_path: "$.journeys[0]"
        json_attributes:
          - legs
          - refreshToken

  - resource: https://v6.db.transport.rest/journeys?from=8000261&to=8003336&results=3
    scan_interval: 3600
    timeout: 20
    sensor:
      - <<: *sensor_common
        name: "DB Hbf Kaufering"
        unique_id: db_hbf_kaufering

  - resource: https://v6.db.transport.rest/journeys?from=8003336&to=8000261&results=3
    scan_interval: 3600
    timeout: 20
    sensor:
      - <<: *sensor_common
        name: "DB Kaufering Return Hbf"
        unique_id: db_kaufering_return_hbf

  - resource: https://v6.db.transport.rest/journeys?from=8003336&to=8005292&results=3
    scan_interval: 3600
    timeout: 20
    sensor:
      - <<: *sensor_common
        name: "DB Kaufering Return Solln"
        unique_id: db_kaufering_return_solln


# -------- Template sensors (computed) ----------------------------------------
# Normalised per-route status used by the disruption automation.
# `delay_minutes` is explicitly cast to int and computed from seconds
# (v6 API reports departureDelay in seconds).
# `route_label` is a human-readable attribute so downstream code
# doesn't have to reverse-engineer entity_ids.
template:
  - sensor:
      - name: "Commute Solln Kaufering status"
        unique_id: commute_solln_kaufering_status
        state: >-
          {% set threshold = states('input_number.commute_delay_threshold_min') | int(5) %}
          {% set legs = state_attr('sensor.db_solln_kaufering', 'legs') %}
          {% if legs and legs[0].cancelled %}cancelled
          {% elif legs and ((legs[0].departureDelay | default(0) | int(0)) // 60) > threshold %}delayed
          {% elif legs %}ok
          {% else %}unknown{% endif %}
        attributes:
          route_label: "Solln → Kaufering"
          delay_minutes: >-
            {% set legs = state_attr('sensor.db_solln_kaufering', 'legs') %}
            {{ ((legs[0].departureDelay | default(0) | int(0)) // 60) if legs else 0 }}
          messages: >-
            {% set legs = state_attr('sensor.db_solln_kaufering', 'legs') %}
            {{ (legs[0].remarks | selectattr('type','equalto','warning') | map(attribute='text') | list) if legs and legs[0].remarks else [] }}

      - name: "Commute Hbf Kaufering status"
        unique_id: commute_hbf_kaufering_status
        state: >-
          {% set threshold = states('input_number.commute_delay_threshold_min') | int(5) %}
          {% set legs = state_attr('sensor.db_hbf_kaufering', 'legs') %}
          {% if legs and legs[0].cancelled %}cancelled
          {% elif legs and ((legs[0].departureDelay | default(0) | int(0)) // 60) > threshold %}delayed
          {% elif legs %}ok
          {% else %}unknown{% endif %}
        attributes:
          route_label: "München Hbf → Kaufering"
          delay_minutes: >-
            {% set legs = state_attr('sensor.db_hbf_kaufering', 'legs') %}
            {{ ((legs[0].departureDelay | default(0) | int(0)) // 60) if legs else 0 }}
          messages: >-
            {% set legs = state_attr('sensor.db_hbf_kaufering', 'legs') %}
            {{ (legs[0].remarks | selectattr('type','equalto','warning') | map(attribute='text') | list) if legs and legs[0].remarks else [] }}

      - name: "Commute Return Hbf status"
        unique_id: commute_return_hbf_status
        state: >-
          {% set threshold = states('input_number.commute_delay_threshold_min') | int(5) %}
          {% set legs = state_attr('sensor.db_kaufering_return_hbf', 'legs') %}
          {% if legs and legs[0].cancelled %}cancelled
          {% elif legs and ((legs[0].departureDelay | default(0) | int(0)) // 60) > threshold %}delayed
          {% elif legs %}ok
          {% else %}unknown{% endif %}
        attributes:
          route_label: "Kaufering → München Hbf"
          delay_minutes: >-
            {% set legs = state_attr('sensor.db_kaufering_return_hbf', 'legs') %}
            {{ ((legs[0].departureDelay | default(0) | int(0)) // 60) if legs else 0 }}
          messages: >-
            {% set legs = state_attr('sensor.db_kaufering_return_hbf', 'legs') %}
            {{ (legs[0].remarks | selectattr('type','equalto','warning') | map(attribute='text') | list) if legs and legs[0].remarks else [] }}

      - name: "Commute Return Solln status"
        unique_id: commute_return_solln_status
        state: >-
          {% set threshold = states('input_number.commute_delay_threshold_min') | int(5) %}
          {% set legs = state_attr('sensor.db_kaufering_return_solln', 'legs') %}
          {% if legs and legs[0].cancelled %}cancelled
          {% elif legs and ((legs[0].departureDelay | default(0) | int(0)) // 60) > threshold %}delayed
          {% elif legs %}ok
          {% else %}unknown{% endif %}
        attributes:
          route_label: "Kaufering → Solln"
          delay_minutes: >-
            {% set legs = state_attr('sensor.db_kaufering_return_solln', 'legs') %}
            {{ ((legs[0].departureDelay | default(0) | int(0)) // 60) if legs else 0 }}
          messages: >-
            {% set legs = state_attr('sensor.db_kaufering_return_solln', 'legs') %}
            {{ (legs[0].remarks | selectattr('type','equalto','warning') | map(attribute='text') | list) if legs and legs[0].remarks else [] }}

  # Fires when any DB sensor is unavailable — lets us notice API outages
  # instead of silently showing stale state.
  - binary_sensor:
      - name: "Commute API stale"
        unique_id: commute_api_stale
        device_class: problem
        state: >-
          {% set ids = [
            'sensor.db_solln_kaufering',
            'sensor.db_hbf_kaufering',
            'sensor.db_kaufering_return_hbf',
            'sensor.db_kaufering_return_solln'
          ] %}
          {{ ids | select('is_state', 'unavailable') | list | count > 0
             or ids | select('is_state', 'unknown')    | list | count == (ids | count) }}


# -------- REST commands ------------------------------------------------------
# Claude API defined here (not in a separate package) because agents 2 and 5
# will reuse it. Move to a dedicated claude.yaml package once Agent 2 lands.
# Model IDs are read from input_text helpers so they can be rotated without a
# config edit + restart (see commute_model_sonnet / commute_model_opus above).
rest_command:
  claude_api:
    url: "https://api.anthropic.com/v1/messages"
    method: POST
    headers:
      x-api-key: !secret anthropic_api_key
      anthropic-version: "2023-06-01"
      content-type: "application/json"
    payload: >-
      {
        "model": {{ model | to_json }},
        "max_tokens": {{ max_tokens | default(1024) }},
        "system": {{ system | default('You are a helpful assistant.') | to_json }},
        "messages": [{"role": "user", "content": {{ prompt | to_json }}}]
      }
    content_type: "application/json"
    timeout: 30

  # On-demand v6.db.transport.rest journey lookup with an explicit departure.
  # Used by the tomorrow branch of /office so we don't have to wait for the
  # scheduled poll (and so we can query a departure time outside the default
  # "now" window). EVA IDs are passed in by the caller — we do NOT hard-code
  # station names anywhere in URL templates.
  #
  # departure_iso MUST be naive local time (no TZ suffix, no "Z"). A `+02:00`
  # suffix gets interpreted as a space inside a URL query string (standard
  # application/x-www-form-urlencoded behaviour) and breaks the hafas-client
  # parser; v6 then silently returns an empty `journeys: []`.
  db_journeys_lookup:
    url: "https://v6.db.transport.rest/journeys?from={{ from_eva }}&to={{ to_eva }}&departure={{ departure_iso }}&results=3"
    method: GET
    timeout: 20


# -------- Scripts ------------------------------------------------------------
script:
  commute_refresh_all:
    alias: Commute - refresh all sensors
    sequence:
      - service: homeassistant.update_entity
        target:
          entity_id:
            - sensor.db_solln_kaufering
            - sensor.db_hbf_kaufering
            - sensor.db_kaufering_return_hbf
            - sensor.db_kaufering_return_solln


# -------- Automations --------------------------------------------------------
automation:
  # ----- Morning polling (05:00-07:00) --------------------------------------
  - id: commute_morning_poll
    alias: Commute - morning poll
    description: Refresh morning route sensors every 5 min during the morning window.
    trigger:
      - platform: time_pattern
        minutes: "/5"
    condition:
      - condition: state
        entity_id: input_boolean.commute_day
        state: "on"
      - condition: time
        after: "05:00:00"
        before: "07:00:00"
    action:
      - service: homeassistant.update_entity
        target:
          entity_id:
            - sensor.db_solln_kaufering
            - sensor.db_hbf_kaufering
    mode: single

  # ----- Evening return polling (16:00-18:00) -------------------------------
  - id: commute_evening_poll
    alias: Commute - evening poll
    description: Refresh return route sensors every 10 min during the return window.
    trigger:
      - platform: time_pattern
        minutes: "/10"
    condition:
      - condition: state
        entity_id: input_boolean.commute_day
        state: "on"
      - condition: time
        after: "16:00:00"
        before: "18:00:00"
    action:
      - service: homeassistant.update_entity
        target:
          entity_id:
            - sensor.db_kaufering_return_hbf
            - sensor.db_kaufering_return_solln
    mode: single

  # ----- Disruption alert ---------------------------------------------------
  # Fires whenever any route goes delayed/cancelled. Deduped via
  # commute_last_alert_fingerprint keyed on (route, date, hour-bucket) so a
  # single disruption within the same hour is only pushed once, even if the
  # sensor flaps ok→delayed→ok→delayed.
  - id: commute_disruption_alert
    alias: Commute - disruption alert
    trigger:
      - platform: state
        entity_id:
          - sensor.commute_solln_kaufering_status
          - sensor.commute_hbf_kaufering_status
          - sensor.commute_return_hbf_status
          - sensor.commute_return_solln_status
        to:
          - delayed
          - cancelled
    condition:
      - condition: state
        entity_id: input_boolean.commute_day
        state: "on"
      - condition: template
        value_template: >-
          {% set bucket = now().strftime('%Y-%m-%d-%H') %}
          {% set fp = trigger.entity_id ~ ':' ~ trigger.to_state.state ~ ':' ~ bucket %}
          {{ fp != states('input_text.commute_last_alert_fingerprint') }}
    action:
      - service: input_text.set_value
        target:
          entity_id: input_text.commute_last_alert_fingerprint
        data:
          value: >-
            {% set bucket = now().strftime('%Y-%m-%d-%H') %}
            {{ trigger.entity_id }}:{{ trigger.to_state.state }}:{{ bucket }}
      - service: telegram_bot.send_message
        target:
          entity_id: notify.pa_bot_wolfgang_l
        data:
          # No parse_mode — DB remarks can contain arbitrary characters and
          # would trip Telegram's legacy Markdown parser.
          message: >-
            🚆 Commute disruption

            Route: {{ trigger.to_state.attributes.route_label | default(trigger.entity_id) }}
            Status: {{ trigger.to_state.state }}
            Delay: {{ trigger.to_state.attributes.delay_minutes | default(0) | int(0) }} min
            {% if trigger.to_state.attributes.messages %}
            Notes: {{ trigger.to_state.attributes.messages | join('; ') }}
            {% endif %}
    mode: queued
    max: 10

  # ----- API stale alert ----------------------------------------------------
  # Pings Telegram if the DB REST sensors start returning unavailable.
  # Fires once on the unavailable→available transition (not per poll).
  - id: commute_api_stale_alert
    alias: Commute - API stale alert
    trigger:
      - platform: state
        entity_id: binary_sensor.commute_api_stale
        to: "on"
        for: "00:15:00"
    condition:
      - condition: state
        entity_id: input_boolean.commute_day
        state: "on"
    action:
      - service: telegram_bot.send_message
        target:
          entity_id: notify.pa_bot_wolfgang_l
        data:
          message: >-
            ⚠️ *Commute API stale*

            DB REST sensors have been unavailable for 15+ min. Disruption
            alerts may be missing. Check HA logs or v6.db.transport.rest status.
          parse_mode: markdown
    mode: single

  # ----- Telegram /office (time-aware) --------------------------------------
  # Mode dispatch based on (optional) arg and local hour:
  #   /office now                   -> live_morning (use polled sensors)
  #   /office tomorrow              -> tomorrow     (explicit 06:00 lookup)
  #   /office (bare) + hour < 14    -> live_morning
  #   /office (bare) + hour < 19    -> live_return  (use polled sensors)
  #   /office (bare) + hour >= 19   -> tomorrow
  #
  # Reply is just Claude's recommendation — no raw sensor dump.
  # commute_day is flipped ON only in the tomorrow branch, and only when
  # Claude returns a viable ALARM= line. If no viable alarm, we leave
  # commute_day OFF and tell the user to toggle it manually.
  - id: commute_telegram_checkin
    alias: Commute - Telegram /office
    trigger:
      - platform: event
        event_type: telegram_command
        event_data:
          command: /office
    variables:
      arg: "{{ (trigger.event.data.args | default([]) | list)[0] | default('') | lower }}"
      hour: "{{ now().hour }}"
      mode: >-
        {{ 'live_morning' if arg == 'now'
           else 'tomorrow'     if arg == 'tomorrow'
           else 'live_morning' if (hour | int(0)) < 14
           else 'live_return'  if (hour | int(0)) < 19
           else 'tomorrow' }}
    action:
      - service: input_text.set_value
        target:
          entity_id: input_text.commute_last_check
        data:
          value: "{{ now().isoformat() }}"

      - choose:
          # -------- live_morning: outbound now ---------------------------------
          - conditions:
              - condition: template
                value_template: "{{ (mode | trim) == 'live_morning' }}"
            sequence:
              - service: script.commute_refresh_all
              - delay: "00:00:05"
              - service: rest_command.claude_api
                data:
                  model: "{{ states('input_text.commute_model_opus') }}"
                  max_tokens: 300
                  system: >-
                    You help the user catch the next Munich -> Kaufering train
                    RIGHT NOW. Plain text, max 5 lines, no markdown. Recommend
                    ONE route (Solln direct, or cycle to Hbf +15 min) with the
                    next viable departure time and a one-line reason.
                  prompt: >-
                    Current time: {{ now().strftime('%H:%M') }}
                    Route A Solln -> Kaufering (direct):
                      Next: {{ states('sensor.db_solln_kaufering') }}
                      Status: {{ states('sensor.commute_solln_kaufering_status') }}
                      Delay: {{ state_attr('sensor.commute_solln_kaufering_status','delay_minutes') | default(0) | int(0) }} min
                      Warnings: {{ state_attr('sensor.commute_solln_kaufering_status','messages') | default([]) }}
                    Route B Munich Hbf -> Kaufering (+15 min cycle to Hbf):
                      Next: {{ states('sensor.db_hbf_kaufering') }}
                      Status: {{ states('sensor.commute_hbf_kaufering_status') }}
                      Delay: {{ state_attr('sensor.commute_hbf_kaufering_status','delay_minutes') | default(0) | int(0) }} min
                      Warnings: {{ state_attr('sensor.commute_hbf_kaufering_status','messages') | default([]) }}
                response_variable: claude_resp
                continue_on_error: true
              - service: telegram_bot.send_message
                target:
                  entity_id: notify.pa_bot_wolfgang_l
                data:
                  # No parse_mode — Claude's text could contain any characters
                  # and a stray '*' or '_' would fail Telegram markdown parsing.
                  message: >-
                    🚆 Morning

                    {{ claude_resp.content.content[0].text
                       if claude_resp is defined
                         and claude_resp.content is defined
                         and claude_resp.content.content is defined
                         and claude_resp.content.content
                       else 'Claude unavailable — check sensors directly.' }}

          # -------- live_return: inbound now -----------------------------------
          - conditions:
              - condition: template
                value_template: "{{ (mode | trim) == 'live_return' }}"
            sequence:
              - service: script.commute_refresh_all
              - delay: "00:00:05"
              - service: rest_command.claude_api
                data:
                  model: "{{ states('input_text.commute_model_opus') }}"
                  max_tokens: 300
                  system: >-
                    You help the user return Kaufering -> Munich RIGHT NOW.
                    Plain text, max 5 lines, no markdown. Recommend ONE
                    direction (via Hbf and cycle home, or direct to Solln)
                    with the next viable departure and a one-line reason.
                  prompt: >-
                    Current time: {{ now().strftime('%H:%M') }}
                    Route C Kaufering -> Munich Hbf (user cycles home):
                      Next: {{ states('sensor.db_kaufering_return_hbf') }}
                      Status: {{ states('sensor.commute_return_hbf_status') }}
                      Delay: {{ state_attr('sensor.commute_return_hbf_status','delay_minutes') | default(0) | int(0) }} min
                      Warnings: {{ state_attr('sensor.commute_return_hbf_status','messages') | default([]) }}
                    Route D Kaufering -> Solln (direct):
                      Next: {{ states('sensor.db_kaufering_return_solln') }}
                      Status: {{ states('sensor.commute_return_solln_status') }}
                      Delay: {{ state_attr('sensor.commute_return_solln_status','delay_minutes') | default(0) | int(0) }} min
                      Warnings: {{ state_attr('sensor.commute_return_solln_status','messages') | default([]) }}
                response_variable: claude_resp
                continue_on_error: true
              - service: telegram_bot.send_message
                target:
                  entity_id: notify.pa_bot_wolfgang_l
                data:
                  message: >-
                    🏠 Return

                    {{ claude_resp.content.content[0].text
                       if claude_resp is defined
                         and claude_resp.content is defined
                         and claude_resp.content.content is defined
                         and claude_resp.content.content
                       else 'Claude unavailable — check sensors directly.' }}

          # -------- tomorrow: explicit next-day 06:00 lookup -------------------
          - conditions:
              - condition: template
                value_template: "{{ (mode | trim) == 'tomorrow' }}"
            sequence:
              - variables:
                  # Tomorrow 06:00, naive local (no TZ suffix — see comment on
                  # rest_command.db_journeys_lookup).
                  tomorrow_iso: >-
                    {{ (now().replace(hour=6, minute=0, second=0, microsecond=0)
                        + timedelta(days=1)).strftime('%Y-%m-%dT%H:%M:%S') }}
                  tomorrow_label: "{{ (now() + timedelta(days=1)).strftime('%a %d.%m') }}"
              - service: rest_command.db_journeys_lookup
                data:
                  from_eva: "8005292"
                  to_eva: "8003336"
                  departure_iso: "{{ tomorrow_iso }}"
                response_variable: solln_resp
                continue_on_error: true
              - service: rest_command.db_journeys_lookup
                data:
                  from_eva: "8000261"
                  to_eva: "8003336"
                  departure_iso: "{{ tomorrow_iso }}"
                response_variable: hbf_resp
                continue_on_error: true
              - variables:
                  solln_journeys: >-
                    {{ solln_resp.content.journeys
                       if solln_resp is defined
                         and solln_resp.content is defined
                         and solln_resp.content.journeys is defined
                       else [] }}
                  hbf_journeys: >-
                    {{ hbf_resp.content.journeys
                       if hbf_resp is defined
                         and hbf_resp.content is defined
                         and hbf_resp.content.journeys is defined
                       else [] }}
              - service: rest_command.claude_api
                data:
                  model: "{{ states('input_text.commute_model_opus') }}"
                  max_tokens: 300
                  system: >-
                    You plan tomorrow's Munich -> Kaufering commute. Output
                    EXACTLY this format, plain text, no markdown:
                    line 1: "RECO: <Solln|Hbf> HH:MM"
                    line 2: one-line rationale
                    line 3: "ALARM=HH:MM"  (wake-to-door 45 min for Solln
                            direct, 60 min for Hbf incl. 15-min cycle).
                    If NO route is viable (both cancelled / only heavy delays),
                    OMIT line 3 entirely and say so on line 2.
                  prompt: >-
                    Tomorrow ({{ tomorrow_label }}) departures from v6.db.transport.rest:

                    Route A Solln -> Kaufering (direct):
                    {% for j in solln_journeys[:3] %}
                    {% set l = j.legs[0] %}
                      {{ (l.departure | as_datetime | as_local).strftime('%H:%M') }}  delay={{ ((l.departureDelay | default(0) | int(0)) // 60) }}m  cancelled={{ l.cancelled | default(false) }}
                    {% else %}
                      (no data)
                    {% endfor %}

                    Route B Munich Hbf -> Kaufering (+15 min cycle to Hbf):
                    {% for j in hbf_journeys[:3] %}
                    {% set l = j.legs[0] %}
                      {{ (l.departure | as_datetime | as_local).strftime('%H:%M') }}  delay={{ ((l.departureDelay | default(0) | int(0)) // 60) }}m  cancelled={{ l.cancelled | default(false) }}
                    {% else %}
                      (no data)
                    {% endfor %}
                response_variable: claude_resp
                continue_on_error: true
              - variables:
                  claude_text: >-
                    {{ claude_resp.content.content[0].text
                       if claude_resp is defined
                         and claude_resp.content is defined
                         and claude_resp.content.content is defined
                         and claude_resp.content.content
                       else '' }}
                  alarm_match: "{{ claude_text | regex_findall('ALARM=(\\d{2}:\\d{2})') }}"
                  has_alarm: "{{ alarm_match | length > 0 }}"
                  alarm_hhmm: "{{ alarm_match[0] if alarm_match else '' }}"
              - service: input_text.set_value
                target:
                  entity_id: input_text.commute_morning_summary
                data:
                  value: "{{ (claude_text or 'no preview')[:255] }}"
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ has_alarm }}"
                    sequence:
                      - service: input_boolean.turn_on
                        target:
                          entity_id: input_boolean.commute_day
                      - service: input_datetime.set_datetime
                        target:
                          entity_id: input_datetime.alarm_time
                        data:
                          time: "{{ alarm_hhmm }}:00"
                      - service: telegram_bot.send_message
                        target:
                          entity_id: notify.pa_bot_wolfgang_l
                        data:
                          message: >-
                            🚆 Tomorrow {{ tomorrow_label }}

                            {{ claude_text }}
                default:
                  # Plain text (no parse_mode) — legacy Telegram Markdown chokes
                  # on underscores inside `commute_day` and the nested code span.
                  - service: telegram_bot.send_message
                    target:
                      entity_id: notify.pa_bot_wolfgang_l
                    data:
                      message: >-
                        🚆 Tomorrow {{ tomorrow_label }}

                        {{ claude_text if claude_text else 'Claude unavailable — no recommendation.' }}

                        No viable alarm. commute_day left off — toggle it manually in HA if you still plan to commute.
    mode: single

  # ----- Telegram /home (return now, any time) ------------------------------
  # Always live_return — useful mid-afternoon or when /office time-dispatch
  # would pick the wrong mode. Does not toggle commute_day.
  - id: commute_telegram_home
    alias: Commute - Telegram /home
    trigger:
      - platform: event
        event_type: telegram_command
        event_data:
          command: /home
    action:
      - service: input_text.set_value
        target:
          entity_id: input_text.commute_last_check
        data:
          value: "{{ now().isoformat() }}"
      - service: script.commute_refresh_all
      - delay: "00:00:05"
      - service: rest_command.claude_api
        data:
          model: "{{ states('input_text.commute_model_opus') }}"
          max_tokens: 300
          system: >-
            You help the user return Kaufering -> Munich RIGHT NOW.
            Plain text, max 5 lines, no markdown. Recommend ONE direction
            (via Hbf and cycle home, or direct to Solln) with the next
            viable departure and a one-line reason.
          prompt: >-
            Current time: {{ now().strftime('%H:%M') }}
            Route C Kaufering -> Munich Hbf (user cycles home):
              Next: {{ states('sensor.db_kaufering_return_hbf') }}
              Status: {{ states('sensor.commute_return_hbf_status') }}
              Delay: {{ state_attr('sensor.commute_return_hbf_status','delay_minutes') | default(0) | int(0) }} min
              Warnings: {{ state_attr('sensor.commute_return_hbf_status','messages') | default([]) }}
            Route D Kaufering -> Solln (direct):
              Next: {{ states('sensor.db_kaufering_return_solln') }}
              Status: {{ states('sensor.commute_return_solln_status') }}
              Delay: {{ state_attr('sensor.commute_return_solln_status','delay_minutes') | default(0) | int(0) }} min
              Warnings: {{ state_attr('sensor.commute_return_solln_status','messages') | default([]) }}
        response_variable: claude_resp
        continue_on_error: true
      - service: telegram_bot.send_message
        target:
          entity_id: notify.pa_bot_wolfgang_l
        data:
          message: >-
            🏠 Return

            {{ claude_resp.content.content[0].text
               if claude_resp is defined
                 and claude_resp.content is defined
                 and claude_resp.content.content is defined
                 and claude_resp.content.content
               else 'Claude unavailable — check sensors directly.' }}
    mode: single

  # ----- Daily reset (opt-in model) -----------------------------------------
  - id: commute_daily_reset
    alias: Commute - daily reset at 19:00
    trigger:
      - platform: time
        at: "19:00:00"
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.commute_day
      - service: input_text.set_value
        target:
          entity_id: input_text.commute_last_alert_fingerprint
        data:
          value: ""
    mode: single
